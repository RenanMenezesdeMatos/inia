# Verificação a cada publicação no GitHub — a mesma do `npm run verificar` (scripts/ci/verificar.mjs), em jobs paralelos.
# Sem segredos: os testes usam provedores falsos e nenhuma API paga. As actions ficam presas por SHA (com a versão ao lado);
# ao atualizar, usar versão publicada há 14 dias ou mais e com runtime do Node que o GitHub ainda roda (docs/security/
# politica-de-dependencias.md). Toda segunda às 06:00 (Brasília) roda sozinho só `seguranca` e `provas`: alerta novo
# contra uma dependência e prova de banco quebrada aparecem mesmo sem publicação.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      provas:
        description: "Rodar também as provas contra PostgreSQL (INIA_DB_PROOF=1)"
        type: boolean
        default: false

permissions:
  contents: read

# Um grupo por evento e ramo: uma publicação nova cancela a verificação da anterior, mas disparar as provas à mão (ou a
# rodada da agenda) não cancela a de uma publicação no mesmo `main`, nem é cancelado por ela.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc -p tsconfig.json --noEmit
      - name: Tipos dos scripts
        run: npm run typecheck:scripts
      - name: Lint
        run: npx eslint .
      - name: Testes
        run: npx vitest run --reporter=dot

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Tipagem estrita (catraca — scripts/typecheck-strict-baseline.json)
        run: node scripts/typecheck-strict.mjs
      - name: Lint
        run: npx eslint
      - name: Testes
        run: npx vitest run --reporter=dot
      - name: Build
        run: npx next build

  # Segredos no código (nomes de arquivo, padrões de chave) e `npm audit` das dependências de produção do backend e da interface:
  # crítica ou alta reprova; moderada/baixa só avisa (docs/security/pendencias-e-riscos.md, R-14). Um alerta novo publicado contra
  # uma dependência pode deixar este job vermelho sem mudança no código — é o aviso que se quer, e por isso ele roda também na agenda.
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Segredos e dependências (npm run security:check)
        run: npm run security:check

  # Provas contra PostgreSQL: na agenda semanal e sob demanda (Actions › CI › Run workflow › "provas"), nunca a cada publicação,
  # porque levam ~10 min. Banco novo com migrations, dados de referência e massa demo — o mesmo ambiente do inia_test. Em
  # 30/10/2026, num banco assim, todas passaram (78 arquivos, 379 casos; docs/dev/validacao-boas-praticas-2026-10-29.md, §12).
  # As de bancos externos pedem os contêineres de exemplo e ficam de fora daqui.
  provas:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.provas)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inia_test
          POSTGRES_USER: inia
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inia -d inia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://inia@localhost:5432/inia_test
      DATABASE_URL: postgresql://inia@localhost:5432/inia_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npm run db:seed:reference:test
      # A massa demo exige a senha das contas de demonstração. No runner ela é aleatória e só vive neste banco descartável.
      - name: Senha descartável da massa demo
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "INIA_DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: npm run db:seed:demo:test
      - name: Provas (INIA_DB_PROOF=1)
        run: INIA_DB_PROOF=1 npx vitest run --reporter=dot --no-file-parallelism --exclude "scripts/poc-tools/**" --exclude "**/node_modules/**" proof
