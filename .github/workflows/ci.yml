# Verificação a cada publicação no GitHub — a mesma do `npm run verificar` (scripts/ci/verificar.mjs), em jobs paralelos.
# Sem segredos: os testes usam provedores falsos e nenhuma API paga. As actions ficam presas por SHA (com a versão ao lado).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      provas:
        description: "Rodar também as provas contra PostgreSQL (INIA_DB_PROOF=1)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc -p tsconfig.json --noEmit
      - name: Tipos dos scripts
        run: npm run typecheck:scripts
      - name: Lint
        run: npx eslint .
      - name: Testes
        run: npx vitest run --reporter=dot

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Tipagem estrita (catraca — scripts/typecheck-strict-baseline.json)
        run: node scripts/typecheck-strict.mjs
      - name: Lint
        run: npx eslint
      - name: Testes
        run: npx vitest run --reporter=dot
      - name: Build
        run: npx next build

  # Provas contra PostgreSQL: só sob demanda (Actions › CI › Run workflow › "provas"), porque levam ~10 min. Banco novo com
  # migrations, dados de referência e massa demo — o mesmo ambiente do inia_test. Em 30/10/2026, num banco assim, todas passaram
  # (78 arquivos, 379 casos; docs/dev/validacao-boas-praticas-2026-10-29.md, §12). As de bancos externos pedem os contêineres de
  # exemplo e ficam de fora daqui.
  provas:
    if: github.event_name == 'workflow_dispatch' && inputs.provas
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inia_test
          POSTGRES_USER: inia
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inia -d inia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://inia@localhost:5432/inia_test
      DATABASE_URL: postgresql://inia@localhost:5432/inia_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npm run db:seed:reference:test
      - run: npm run db:seed:demo:test
      - name: Provas (INIA_DB_PROOF=1)
        run: INIA_DB_PROOF=1 npx vitest run --reporter=dot --no-file-parallelism --exclude "scripts/poc-tools/**" --exclude "**/node_modules/**" proof
